<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artaqi - Website Pertama Saya</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
  body {
    background: #0f0f0f; color: white;
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
    text-align: center; padding: 20px;
  }
  .card {
    background: #1a1a1a; padding: 40px 30px;
    border-radius: 20px; max-width: 500px; width: 100%;
    border: 1px solid #333;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
  }
  .foto {
    width: 110px; height: 110px; border-radius: 50%;
    background: linear-gradient(45deg, #6a5cff, #00d4ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 50px; margin: 0 auto 20px;
  }
  h1 { font-size: 32px; margin-bottom: 5px; }
  h1 span { color: #6a5cff; }
  .tag { color: #00d4ff; font-weight: bold; margin-bottom: 15px; }
  p { color: #aaa; line-height: 1.6; margin-bottom: 25px; }
  .btn {
    display: block; background: white; color: black;
    padding: 14px; border-radius: 12px;
    text-decoration: none; font-weight: bold; margin-bottom: 12px;
  }
  .btn-ungu { background: #6a5cff; color: white; }
  .btn-biru { background: #1a1a1a; color: white; border: 1px solid #333; }
  .footer { margin-top: 20px; font-size: 12px; color: #555; }
</style>
</head>
<body>
  <div class="card">
    <div class="foto">👋</div>
    <h1>Halo, Saya <span>Artaqi!</span></h1>
    <div class="tag">Belajar Ngoding dari Android 📱</div>
    <p>Ini website pertama saya. Saya bikin sendiri dari Tablet Android, pakai GitHub + GitHub Pages. Saya lagi belajar jadi programmer!</p>
    <a class="btn btn-ungu" href="https://github.com/artaqi">🐙 Lihat GitHub Saya</a>
    <a class="btn" href="https://artaqi.github.io/Belajar-github/">🌐 Website Saya</a>
    <a class="btn btn-biru" href="#">📸 Instagram Saya</a>
    <div class="footer">Dibuat dengan ❤️ dari Android • 2026</div>
  </div>
</body>
</html>
